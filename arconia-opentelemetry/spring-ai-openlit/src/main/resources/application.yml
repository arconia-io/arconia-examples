spring:
  application:
    name: spring-ai-openlit

  ai:
    ollama:
      init:
        pull-model-strategy: when-missing
      chat:
        model: qwen3.5:4b
      embedding:
        model: granite-embedding:30m

arconia:
  observations:
    conventions:
      opentelemetry:
        ai:
          flavor: openlit
